# TLS Ingress + cert-manager (Let's Encrypt HTTP-01). Replaces the Docker "Caddy"
# service. Requires: an ingress controller ($INGRESS_CLASS) + cert-manager installed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cps
  namespace: $NS
  annotations:
    cert-manager.io/issuer: cps-letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"   # big release/patch uploads
spec:
  ingressClassName: $INGRESS_CLASS
  tls:
    - hosts: ["$DOMAIN"]
      secretName: cps-tls
  rules:
    - host: $DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: cps, port: { number: 80 } }
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cps-letsencrypt
  namespace: $NS
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: $ACME_EMAIL
    privateKeySecretRef: cps-acme-key
    solvers:
      - http01:
          ingress: { className: $INGRESS_CLASS }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cps-tls
  namespace: $NS
spec:
  secretName: cps-tls
  issuerRef: { name: cps-letsencrypt }
  dnsNames: ["$DOMAIN"]
