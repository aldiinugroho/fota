# Control plane as a 1-replica StatefulSet + PVC (SQLite needs a single stable
# writer) + the ClusterIP Service. Image is set to :latest here and pinned to a
# git tag by Jenkins (`kubectl set image`).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cps
  namespace: $NS
spec:
  serviceName: cps
  replicas: 1
  selector:
    matchLabels: { app: cps }
  template:
    metadata:
      labels: { app: cps }
    spec:
      imagePullSecrets:
        - name: $IMAGE_PULL_SECRET
      containers:
        - name: cps
          image: $REGISTRY/$IMAGE:latest
          ports:
            - { containerPort: 8080, name: http }
          envFrom:
            - configMapRef: { name: cps-config }
            - secretRef: { name: cps-secrets }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: $STORAGE_CLASS
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: cps
  namespace: $NS
  labels: { app: cps }
spec:
  selector: { app: cps }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
