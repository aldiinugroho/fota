apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: controlplane
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/aldiinugroho/fota.git"
    path: k8s/controlplane
    targetRevision: main
  destination:
    server: "https://kubernetes.default.svc"
    namespace: shorebird
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
